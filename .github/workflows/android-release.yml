# On a GitHub release, a pushed v* tag, or a manual run given a tag, builds the Android apps
# and attaches them to that release, creating it if there is none.
#
# The apk carries no vast.ai key: it asks for one on first start. Signing uses the
# ANDROID_KEYSTORE secret (a base64 .jks) with ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS when they are set, so that each release installs over the last;
# without them it is signed with a throwaway debug key.
name: android-release

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to create or update, e.g. v1. Empty builds without releasing.
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE secret: signing with a debug key"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ env.TAG || 'dev' }}
          VERSION_CODE: ${{ github.run_number }}
        run: android/build.sh
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          cp android/app/build/outputs/apk/release/app-release.apk "katahex-gpu-$TAG.apk"
          cp android/worker/build/outputs/apk/release/worker-release.apk "playhex-worker-$TAG.apk"
          gh release upload "$TAG" katahex-gpu-*.apk playhex-worker-*.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: katahex-gpu-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/worker/build/outputs/apk/release/worker-release.apk
