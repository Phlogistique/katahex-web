# On a GitHub release, builds the Android apps and attaches them to the release.
#
# The apk carries no vast.ai key: it asks for one on first start. Signing uses the
# ANDROID_KEYSTORE secret (a base64 .jks) with ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS when they are set, so that each release installs over the last;
# without them it is signed with a throwaway debug key.
name: android-release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE secret: signing with a debug key"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ github.event.release.tag_name || 'dev' }}
          VERSION_CODE: ${{ github.run_number }}
        run: android/build.sh
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "katahex-gpu-${{ github.event.release.tag_name }}.apk"
          cp android/worker/build/outputs/apk/release/worker-release.apk "playhex-worker-${{ github.event.release.tag_name }}.apk"
          gh release upload "${{ github.event.release.tag_name }}" katahex-gpu-*.apk playhex-worker-*.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: katahex-gpu-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/worker/build/outputs/apk/release/worker-release.apk
