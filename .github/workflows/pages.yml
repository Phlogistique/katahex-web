# Builds the page and publishes it to GitHub Pages.
#
# Only the ui is built here: the engine (emscripten) and the net (a 97 MB file
# that is not in this repository) are built by hand and committed under
# public-web/, so a push that only touches the ui deploys on its own.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build:web
        working-directory: ui
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
