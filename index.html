<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KataHex net in the browser</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem; max-width: 42rem; }
  button, select { font: inherit; padding: .4rem .8rem; }
  pre { background: #f4f4f4; padding: .6rem; overflow-x: auto; white-space: pre-wrap; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; } pre { background: #1e1e1e; }
  }
</style>
<h1>KataHex net in the browser</h1>
<p>Times forward passes of the hex27x3 net, about 100 MB whichever runtime loads it.</p>
<p>
  <label>runtime <select id="runtime">
    <option value="onnx-webgpu-fp16">onnxruntime webgpu fp16</option>
    <option value="onnx-webgpu">onnxruntime webgpu</option>
    <option value="tfjs-webgpu">tensorflow.js webgpu</option>
    <option value="onnx-wasm">onnxruntime wasm</option>
    <option value="tfjs-wasm">tensorflow.js wasm</option>
  </select></label>
  <label>board <select id="size"><option>11</option><option>13</option></select></label>
  <button id="go">Run</button>
</p>
<pre id="log"></pre>
<script type="module" src="/src/bench.ts"></script>
