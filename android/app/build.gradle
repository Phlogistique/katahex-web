plugins {
    id 'com.android.application'
}

// With VASTAI_API_KEY in the environment the key is baked into the apk, which is then as
// secret as the key: never commit or publish it. Without it -- the release build CI makes --
// the app asks for a key on first start and keeps it on the phone.
def env = { String name, String fallback -> System.getenv(name) ?: fallback }
def quoted = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'net.katahex.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'net.katahex.remote'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(env('VERSION_CODE', '1'))
        versionName env('VERSION_NAME', 'dev')

        buildConfigField 'String', 'VAST_API_KEY', quoted(env('VASTAI_API_KEY', ''))
        buildConfigField 'String', 'IMAGE', quoted(env('KATAHEX_IMAGE', 'ghcr.io/phlogistique/katahex-server:latest'))
        // Cheapest offer under this price wins; raise it to skip the slowest cards.
        buildConfigField 'double', 'MAX_DOLLARS_PER_HOUR', env('KATAHEX_MAX_DPH', '0.5')
        // Seconds the server waits for a sign of life before destroying itself.
        buildConfigField 'int', 'IDLE_TIMEOUT', env('KATAHEX_IDLE_TIMEOUT', '600')
        buildConfigField 'int', 'MAX_LIFETIME', env('KATAHEX_MAX_LIFETIME', '43200')
    }

    buildFeatures { buildConfig true }
    sourceSets.main.java.srcDir '../vast'

    // A release signed with the same key every time installs over the last one. CI signs with
    // the ANDROID_KEYSTORE secret when the repository has one, and with a throwaway debug key
    // otherwise, which means uninstalling before each upgrade.
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
